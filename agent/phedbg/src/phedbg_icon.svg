<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="tiny" version="1.1"
     width="44" height="44" viewBox="0 0 44 44">
  <!-- USB plug body -->
  <rect x="15" y="28" width="14" height="12" rx="2" fill="#666"/>
  <rect x="18" y="32" width="3" height="5" fill="#ccc"/>
  <rect x="23" y="32" width="3" height="5" fill="#ccc"/>
  <rect x="17" y="38" width="10" height="4" rx="1" fill="#888"/>
  <!-- Bug body -->
  <ellipse cx="22" cy="16" rx="8" ry="9" fill="#2196F3"/>
  <!-- Bug head -->
  <circle cx="22" cy="8" r="4" fill="#1565C0"/>
  <!-- Eyes -->
  <circle cx="20" cy="7" r="1.2" fill="#fff"/>
  <circle cx="24" cy="7" r="1.2" fill="#fff"/>
  <!-- Antennae -->
  <line x1="20" y1="4" x2="16" y2="1" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="4" x2="28" y2="1" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="14" y1="12" x2="9" y2="9" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="9" y2="16" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="20" x2="9" y2="23" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="12" x2="35" y2="9" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="16" x2="35" y2="16" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="20" x2="35" y2="23" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
