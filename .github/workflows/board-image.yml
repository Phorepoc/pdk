# board-image.yml -- the reusable build workflow (docs/layering.md). It knows no board: what it builds comes from the
# caller.
#
#   core    core's workflow calls it with `arch`: pdk + core alone, for one architecture; with publish_layer the build
#           tree becomes ghcr.io/<owner>/core-<arch>:<core commit> (+ :main), the layer every board starts from
#   board   a board repository calls it without `arch`: its board.conf names the repositories and the architecture,
#           its board.lock pins their commits; the build starts from core-<arch> at the pinned core commit, runs each
#           repository's recipes/prepare.sh, builds every component and then the board's RELEASE recipe
#           (`phe image release`), which writes the files to publish; `release: true` attaches them to the caller's
#           release for its tag
#
# Jobs (no job nears the 6-hour limit of a hosted runner):
#   prepare   setup (.github/actions/board-setup), the starting tree (the published core layer), exports, the
#             repositories' prepare recipes (their results cached, tools/ci/prepare_cache.sh), resources. Then, when
#             little is left to compile -- the layer was made by the same compile front end (tools/ci/frontend_id.sh)
#             -- the rest of the build in the same job: board-finish
#   compile   otherwise: N shards in parallel, each compiling every N-th component
#             (`component build -A -compile-only -shard i/N`) from the tree handed on as a run image
#   finish    the tree + every shard's objects, then board-finish
# board-finish (.github/actions/board-finish): the link pass in provider order, then the layer or the release.
#
# Whether an object is compiled again is decided by its content (compiler, command line, the bytes of every file it
# read; tools/emitter/objcache.py), never by a time, so the published layer and any earlier run's objects are reused
# wherever they are still right, and nowhere else. Splitting into shards is only a speed choice.
#
# Concurrency: the callers' release workflows serialize with `concurrency: {group: release, cancel-in-progress: false}`.
# GitHub keeps one running and one pending run per group and cancels an older *pending* one when a newer is queued; a
# running release is never cancelled (it may be publishing). That is already the safe form for versions: each run
# computes its version from the tags and the commits since the last release, so the newest pending run releases what
# the cancelled one would have.
#
# A board's release workflow:
#   jobs:
#     image:
#       uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
#       with: { version: "${{ needs.version.outputs.version }}" }   # + draft: true when a hardware check publishes it
#       permissions: { contents: write, packages: write }

name: board-image

on:
  workflow_call:
    inputs:
      arch:
        description: "Build core alone for this architecture (x32, arm); empty = the caller is a board repository"
        type: string
        default: ""
      release:
        description: "Attach the release files to the caller's release for this tag"
        type: boolean
        default: false
      version:
        description: "Tag and release this version (v1.2.3) once the image is built and its boot test passed"
        type: string
        default: ""
      draft:
        description: "Make the release a draft (published by hand after a hardware check)"
        type: boolean
        default: false
      images:
        description: "Run the board's RELEASE recipe; false = build the components only"
        type: boolean
        default: true
      publish_layer:
        description: "Core builds: push the build tree as ghcr.io/<owner>/core-<arch>:<core commit> (+ :main)"
        type: boolean
        default: false
      explain:
        description: "Name the file that made each object rebuild (OBJCACHE_EXPLAIN=1; makes the build tree larger): for a test run"
        type: boolean
        default: false
      layer_prefix:
        description: "A prefix for the layer's tags (test-<commit>, test-main): a test run reads and writes its own layers, never the ones the boards use"
        type: string
        default: ""

env:
  PHOREPOC_IMAGE: ghcr.io/phorepoc/base:latest
  SHARDS: 4
  OBJCACHE_EXPLAIN: ${{ inputs.explain && '1' || '' }}
  # the run image that hands the tree from job to job: one package per calling repository (a package belongs to
  # the repository that first pushed it); no attempt number, so a re-run of the failed jobs finds the tree again; the
  # architecture, since core's workflow calls this once per architecture in one run
  RUN_IMAGE: run-${{ github.event.repository.name }}:${{ github.run_id }}${{ inputs.arch && format('-{0}', inputs.arch) || '' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      now: ${{ steps.now.outputs.now }}
      shards: ${{ steps.mode.outputs.shards }}
    steps:
      - id: now
        run: echo "now=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: Start from the published core layer (core-<arch> at the pinned core commit, else :main)
        id: layer
        run: |
          for tag in "${{ inputs.layer_prefix }}${{ steps.setup.outputs.core }}" "${{ inputs.layer_prefix }}main"; do
            img="ghcr.io/$OWNER/core-${{ steps.setup.outputs.arch }}:$tag"
            if docker pull -q "$img" 2>/dev/null; then
              id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
              docker rmi "$img" >/dev/null; echo "started from $img"; du -sh build; break
            fi
          done
          [ -d build/epoc32 ] || echo "no published core layer: a full (cold) build"

      # One job compiles when little is left to compile: the tree started from a layer that the same compile front end
      # made (tools/ci/frontend_id.sh), so what differs is the board's own components and whatever changed since. The
      # shards are for the rest -- no layer, or a changed compiler, flag set or build script that recompiles most of
      # the tree. Only a choice of speed: an object is reused or rebuilt by its content either way (objcache.py).
      - name: Compile in this job, or in shards
        id: mode
        run: |
          shards=$SHARDS
          here=$(sh pdk/tools/ci/frontend_id.sh 2>/dev/null || echo unknown)
          if [ "$here" != unknown ] && [ -f build/.compile-frontend ] && [ "$(cat build/.compile-frontend)" = "$here" ]; then
            shards=0
          fi
          echo "compile front end: $here; the tree's: $(cat build/.compile-frontend 2>/dev/null || echo none)"
          echo "shards: $shards (0 = compile in this job)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

      # (a pdk from before objcache.py reuses objects by modification time: dates from content)
      - name: Dates from content (pdk before objcache.py)
        env: { SRCSTAMP_NOW: "${{ steps.now.outputs.now }}" }
        run: |
          [ -f pdk/tools/emitter/objcache.py ] || python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - name: Exports + header case links
        run: |
          phe source export -a
          phe source mbg -a

      # what a repository's prepare recipe makes is reused when what decides it is unchanged (tools/ci/prepare_cache.sh)
      - name: The prepare recipes' cache
        id: pcache
        run: sh pdk/tools/ci/prepare_cache.sh || true

      - name: Restore it
        if: steps.pcache.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.pcache.outputs.paths }}
          key: ${{ steps.pcache.outputs.key }}

      - name: The repositories' prepare recipes (recipes/prepare.sh)
        run: |
          for r in $(echo "$PHOREPOC_ADAPTATIONS" | tr : ' '); do
            [ -f "$r/recipes/prepare.sh" ] || continue
            echo "== $(basename "$r")"; (cd "$r" && bash recipes/prepare.sh)
          done

      - name: Resources (.rsc + the .rsg headers every component includes)
        run: |
          phe component resources -A > resources-1.log 2>&1 || true
          phe source casefix -a     # links the .rsg spellings just generated (Linux is case-sensitive)
          phe component resources -A 2>&1 | tee resources.log | tail -n 5
          echo "resources: $(grep -c ': FAILED' resources.log || true) component(s) failed"; grep ': FAILED' resources.log | sort -u | head -20 || true

      - name: Hand the tree on (run image)
        if: steps.mode.outputs.shards != '0'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          printf 'FROM busybox:1.36\nCOPY build /build\n' > Dockerfile.layer; printf '*\n!build\n' > .dockerignore
          docker build -q -f Dockerfile.layer -t "$img" .
          docker push -q "$img"

      - uses: Phorepoc/pdk/.github/actions/board-finish@main
        if: steps.mode.outputs.shards == '0'
        with:
          arch: ${{ steps.setup.outputs.arch }}
          board: ${{ steps.setup.outputs.board }}
          core: ${{ steps.setup.outputs.core }}
          list: ${{ steps.setup.outputs.list }}
          core_arch: ${{ inputs.arch }}
          images: ${{ inputs.images }}
          publish_layer: ${{ inputs.publish_layer }}
          layer_prefix: ${{ inputs.layer_prefix }}
          version: ${{ inputs.version }}
          release: ${{ inputs.release }}
          draft: ${{ inputs.draft }}

  compile:
    needs: prepare
    if: needs.prepare.outputs.shards != '0'
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # = SHARDS
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: The prepared tree
        run: |
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          [ -f pdk/tools/emitter/objcache.py ] || python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}
          touch build/.shard-start

      - name: Compile shard ${{ matrix.shard }}
        run: |
          phe component build -A -arch "$PHOREPOC_ARCH" -compile-only -shard ${{ matrix.shard }}/$SHARDS \
            2>&1 | tee compile.log | tail -n 20
          grep -h '^objcache:' compile.log || true

      - name: The files this shard wrote
        run: |
          sudo find build -newer build/.shard-start \( -type f -o -type l \) -print0 \
            | sudo tar --null -T - --zstd -cf shard-${{ matrix.shard }}.tar.zst
          ls -l shard-${{ matrix.shard }}.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ inputs.arch }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.tar.zst
          retention-days: 1
          compression-level: 0

  finish:
    needs: [prepare, compile]
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    if: ${{ !cancelled() && needs.prepare.outputs.shards != '0' && needs.compile.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: The prepared tree + every shard's objects
        run: |
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          [ -f pdk/tools/emitter/objcache.py ] || python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ inputs.arch }}-*
          path: shards

      - name: "Unpack the shards (the link pass reuses their objects: same content, same key)"
        run: for f in shards/*/*.tar.zst; do tar --zstd -xf "$f"; done; rm -rf shards

      - uses: Phorepoc/pdk/.github/actions/board-finish@main
        with:
          arch: ${{ steps.setup.outputs.arch }}
          board: ${{ steps.setup.outputs.board }}
          core: ${{ steps.setup.outputs.core }}
          list: ${{ steps.setup.outputs.list }}
          core_arch: ${{ inputs.arch }}
          images: ${{ inputs.images }}
          publish_layer: ${{ inputs.publish_layer }}
          layer_prefix: ${{ inputs.layer_prefix }}
          version: ${{ inputs.version }}
          release: ${{ inputs.release }}
          draft: ${{ inputs.draft }}
