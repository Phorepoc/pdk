# board-image.yml -- the reusable workflow every device repository calls to build its board's image (and, on a tag,
# to publish it as a release of that repository), and core's build.yml calls to publish the build tree. One
# implementation for all boards, split so no job nears the 6-hour limit of a hosted runner:
#
#   prepare   checks out pdk, core and the board's repositories at the caller's board.lock (setup: .github/actions/
#             board-setup), starts from the published build image build-<board> (core's last build; srcstamp.py dates
#             the checkout by content so only real changes recompile), exports the headers, builds the layers (tls,
#             Mesa for the PinePhone) and the resources, and hands the tree on as a run image
#   compile   N shards in parallel, each compiling every N-th component (objects only: `component build -A
#             -compile-only -shard i/N`); each uploads the files it wrote
#   finish    the prepared tree + every shard's objects, then `component build -A` links in provider order (the
#             compiling is done); publishes the tree (publish_layer) and makes the images: pc -> the bootable ISO + a
#             VirtualBox appliance (.ova); pinephone -> the SD-card image (+ the U-Boot source it embeds, which its
#             licence asks us to offer); with `release: true` attaches them to the caller's release for its tag
#
# Caller (in adaptation-pc / adaptation-pinephone, .github/workflows/release.yml):
#   jobs:
#     image:
#       uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
#       with: { board: pc, release: ${{ startsWith(github.ref, 'refs/tags/') }} }
#       permissions: { contents: write, packages: write }

name: board-image

on:
  workflow_call:
    inputs:
      board:
        description: "The board (ph board list): pc or pinephone"
        type: string
        required: true
      release:
        description: "Attach the images to the caller's release for this tag"
        type: boolean
        default: false
      layers:
        description: "Layer repositories built in (space separated), besides the board's adaptations"
        type: string
        default: "tls"
      images:
        description: "Make the board's images (ISO + .ova / SD card); false = build the components only"
        type: boolean
        default: true
      publish_layer:
        description: "Push the build tree as ghcr.io/<owner>/build-<board>:<core commit> (+ :main) for later runs to start from"
        type: boolean
        default: false

env:
  PHOREPOC_IMAGE: ghcr.io/phorepoc/base:latest
  SHARDS: 4

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      now: ${{ steps.now.outputs.now }}
    steps:
      - id: now
        run: echo "now=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { board: "${{ inputs.board }}", layers: "${{ inputs.layers }}" }

      - name: Start from the published build (build-<board> at the pinned core commit, else :main)
        run: |
          for tag in "${{ steps.setup.outputs.core }}" main; do
            img="ghcr.io/$OWNER/build-${{ inputs.board }}:$tag"
            if docker pull -q "$img" 2>/dev/null; then
              id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
              docker rmi "$img" >/dev/null; echo "started from $img"; du -sh build; break
            fi
          done
          [ -f build/.srcstamp ] || echo "no published build: a full (cold) build"

      - name: Dates from content
        env: { SRCSTAMP_NOW: "${{ steps.now.outputs.now }}" }
        run: python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - name: Exports + header case links
        run: |
          ph source export -a -b ${{ inputs.board }}
          ph source mbg -a -b ${{ inputs.board }}

      - name: Layer recipes (tls -- mbedTLS + the CA bundle at their pinned versions)
        if: contains(inputs.layers, 'tls')
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e PHOREPOC_BUILD="$PWD/build" -e PHOREPOC_PDK="$PWD/pdk" \
            -e PHOREPOC_CORE -e PHOREPOC_SYMBIAN -e PHOREPOC_ADAPTATIONS \
            "$PHOREPOC_IMAGE" bash -c 'set -e; bash tls/recipes/fetch_mbedtls.sh; bash tls/recipes/fetch_cacert.sh
              if [ "${{ inputs.board }}" = pc ]; then bash tls/recipes/build_mbedtls.sh; fi'

      - name: Mesa for ARM (mesa-symbian -> build/mesa-build/arm/*.a, which phgl links)
        if: inputs.board == 'pinephone'
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD/mesa-symbian" -e PHOREPOC_BUILD="$PWD/build" \
            -e PHOREPOC_CORE="$PWD/core" -e PHOREPOC_PDK="$PWD/pdk" ghcr.io/phorepoc/mesa bash build.sh

      - name: Resources (.rsc + the .rsg headers every component includes)
        run: |
          # a bulk pass reports the components it could not build and goes on (exit 1 if any failed): the image steps
          # are the verdict, so the count goes to the log instead of failing the job
          ph component resources -A -b ${{ inputs.board }} > resources-1.log 2>&1 || true
          ph source casefix -a -b ${{ inputs.board }}     # links the .rsg spellings just generated (Linux is case-sensitive)
          ph component resources -A -b ${{ inputs.board }} 2>&1 | tee resources.log | tail -n 5
          echo "resources: $(grep -c ': FAILED' resources.log || true) component(s) failed"; grep ': FAILED' resources.log | sort -u | head -20 || true

      - name: Hand the tree on (run image)
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          img="ghcr.io/$OWNER/build-${{ inputs.board }}:run-${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'FROM busybox:1.36\nCOPY build /build\n' > Dockerfile.layer; printf '*\n!build\n' > .dockerignore
          docker build -q -f Dockerfile.layer -t "$img" .
          docker push -q "$img"

  compile:
    needs: prepare
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { board: "${{ inputs.board }}", layers: "${{ inputs.layers }}" }

      - name: The prepared tree
        run: |
          img="ghcr.io/$OWNER/build-${{ inputs.board }}:run-${{ github.run_id }}-${{ github.run_attempt }}"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}
          touch build/.shard-start

      - name: Compile shard ${{ matrix.shard }}
        run: |
          arch=x32; [ "${{ inputs.board }}" = pinephone ] && arch=arm
          ph component build -A -arch $arch -b ${{ inputs.board }} -compile-only -shard ${{ matrix.shard }}/$SHARDS \
            2>&1 | tee compile.log | tail -n 20

      - name: The files this shard wrote
        run: |
          sudo find build -newer build/.shard-start \( -type f -o -type l \) -print0 \
            | sudo tar --null -T - --zstd -cf shard-${{ matrix.shard }}.tar.zst
          ls -l shard-${{ matrix.shard }}.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ inputs.board }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.tar.zst
          retention-days: 1
          compression-level: 0

  finish:
    needs: [prepare, compile]
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    if: ${{ !cancelled() && needs.compile.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { board: "${{ inputs.board }}", layers: "${{ inputs.layers }}" }

      - name: The prepared tree + every shard's objects
        run: |
          img="ghcr.io/$OWNER/build-${{ inputs.board }}:run-${{ github.run_id }}-${{ github.run_attempt }}"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ inputs.board }}-*
          path: shards

      - name: Unpack the shards (their objects are newer than every source, so the link pass does not recompile)
        run: for f in shards/*/*.tar.zst; do tar --zstd -xf "$f"; done; rm -rf shards

      - name: Link every component, providers first
        run: |
          arch=x32; [ "${{ inputs.board }}" = pinephone ] && arch=arm
          ph component build -A -arch $arch -b ${{ inputs.board }} 2>&1 | tee component-build.log | tail -n 20
          # a bulk build goes on past a component that fails (exit 1): the image steps are the verdict, so name them here
          failed=$(awk '/^=== /{c=$2} /FAIL/{print c}' component-build.log | tr -d : | sort -u)
          echo "components failed: $(echo "$failed" | grep -c . || true)"; echo $failed | fold -w 200

      - name: Relink what was linked before a provider of its existed (x32 import stubs; dependency cycles need passes)
        if: inputs.board == 'pc'
        run: |
          for pass in 1 2 3 4; do
            keys=$(ph component stale -b pc | awk -F: '/: relink/ { print $1 }')
            [ -n "$keys" ] || break
            echo "pass $pass: relink $(echo $keys | wc -w): $(echo $keys | cut -c1-300)"
            ph component build -b pc $keys >> component-relink.log 2>&1 || true
          done
          ph component stale -b pc | tail -n 1

      - name: Own the build folder (the container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Record the source contents this build was made from
        run: python3 pdk/tools/ci/srcstamp.py save build ${{ steps.setup.outputs.list }}

      - name: Publish the build tree (build-<board>:<core commit> + :main)
        if: inputs.publish_layer
        run: |
          img="ghcr.io/$OWNER/build-${{ inputs.board }}"
          core="${{ steps.setup.outputs.core }}"
          printf 'FROM busybox:1.36\nCOPY build /build\n' > Dockerfile.layer; printf '*\n!build\n' > .dockerignore
          docker build -q -f Dockerfile.layer -t "$img:$core" -t "$img:main" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" .
          docker push -q "$img:$core"; docker push -q "$img:main"
          docker rmi "$img:$core" "$img:main" >/dev/null

      - name: Images (pc) -- ROM, bootable ISO, VirtualBox appliance
        if: inputs.images && inputs.board == 'pc'
        run: |
          ph image zdata -b pc
          ph image skin -b pc                   # the default skin package (the UI needs one)
          ph image rom -b pc -O prune=1         # (drops what needs layers this board does not ship yet, e.g. Mesa)
          ph image kernel -b pc
          ph image vbox -b pc
          mkdir -p out
          cp build/x86/ekern/phorepoc-ekern.iso out/phorepoc-pc.iso
          cp build/x86/Phorepoc.ova out/phorepoc-pc.ova

      # the image links the AArch64 entry shim; the build container has no AArch64 GCC (locally tools/make_arm_shim.sh
      # builds it in another image), the runner gets one from apt -- the same commands
      - name: The AArch64 entry shim (pinephone)
        if: inputs.images && inputs.board == 'pinephone'
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu > /dev/null
          mkdir -p build/arm/a53
          aarch64-linux-gnu-gcc -c -DTARGET=0x40300000 adaptation-a64/os/src/phorepoc-arm/a53shim/shim.S -o "$RUNNER_TEMP/shim.o"
          aarch64-linux-gnu-ld -Ttext=0 "$RUNNER_TEMP/shim.o" -o "$RUNNER_TEMP/shim.elf"
          aarch64-linux-gnu-objcopy -O binary "$RUNNER_TEMP/shim.elf" build/arm/a53/shim-ram-noprobe.bin
          ls -l build/arm/a53/shim-ram-noprobe.bin

      - name: Images (pinephone) -- the SD-card image
        if: inputs.images && inputs.board == 'pinephone'
        run: |
          ph image zdata -b pinephone
          ph image skin -b pinephone
          ph image pinephone -b pinephone
          sudo chown -R "$(id -u):$(id -g)" build
          # the SD card (on the host: its script runs docker for the FAT tools + Debian's U-Boot)
          (cd adaptation-pinephone/os && O="$GITHUB_WORKSPACE/build/pinephone" RELEASE=1 bash tools/phorepoc-arm/make_pinephone_sd.sh)
          mkdir -p out
          cp --sparse=always build/pinephone/phorepoc-pinephone-sd.img out/phorepoc-pinephone.img
          xz -T0 -6 out/phorepoc-pinephone.img
          cp build/pinephone/uboot/u-boot-source-*.tar out/

      - name: Checksums + provenance
        if: inputs.images
        run: |
          mkdir -p out
          cp built-from.txt out/
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: inputs.images
        with:
          name: phorepoc-${{ inputs.board }}
          path: out/
          if-no-files-found: warn

      - name: Release
        if: inputs.images && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$tag" -R "${{ github.repository }}" --title "$tag" --notes-file /dev/null --draft
          gh release upload "$tag" out/* -R "${{ github.repository }}" --clobber
