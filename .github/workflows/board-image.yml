# board-image.yml -- the reusable build workflow (docs/layering.md). It knows no board: what it builds comes from the
# caller.
#
#   core    core's workflow calls it with `arch`: pdk + core alone, for one architecture; with publish_layer the build
#           tree becomes ghcr.io/<owner>/core-<arch>:<core commit> (+ :main), the layer every board starts from
#   board   a board repository calls it without `arch`: its board.conf names the repositories and the architecture,
#           its board.lock pins their commits; the build starts from core-<arch> at the pinned core commit, runs each
#           repository's recipes/prepare.sh, builds every component and then the board's RELEASE recipe
#           (`ph image release`), which writes the files to publish; `release: true` attaches them to the caller's
#           release for its tag
#
# Split so no job nears the 6-hour limit of a hosted runner:
#   prepare   setup (.github/actions/board-setup), the starting tree, exports, prepare recipes, resources; hands the
#             tree on as a run image
#   compile   N shards in parallel, each compiling every N-th component (`component build -A -compile-only -shard i/N`)
#   finish    the tree + every shard's objects, the link pass in provider order, then the layer or the release
#
# A board's release workflow:
#   jobs:
#     image:
#       uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
#       with: { release: "${{ startsWith(github.ref, 'refs/tags/') }}" }
#       permissions: { contents: write, packages: write }

name: board-image

on:
  workflow_call:
    inputs:
      arch:
        description: "Build core alone for this architecture (x32, arm); empty = the caller is a board repository"
        type: string
        default: ""
      release:
        description: "Attach the release files to the caller's release for this tag"
        type: boolean
        default: false
      images:
        description: "Run the board's RELEASE recipe; false = build the components only"
        type: boolean
        default: true
      publish_layer:
        description: "Core builds: push the build tree as ghcr.io/<owner>/core-<arch>:<core commit> (+ :main)"
        type: boolean
        default: false

env:
  PHOREPOC_IMAGE: ghcr.io/phorepoc/base:latest
  SHARDS: 4
  # the run image that hands the tree from job to job: one package per calling repository (a package belongs to
  # the repository that first pushed it)
  RUN_IMAGE: run-${{ github.event.repository.name }}:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      now: ${{ steps.now.outputs.now }}
    steps:
      - id: now
        run: echo "now=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: Start from the published core layer (core-<arch> at the pinned core commit, else :main)
        run: |
          for tag in "${{ steps.setup.outputs.core }}" main; do
            img="ghcr.io/$OWNER/core-${{ steps.setup.outputs.arch }}:$tag"
            if docker pull -q "$img" 2>/dev/null; then
              id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
              docker rmi "$img" >/dev/null; echo "started from $img"; du -sh build; break
            fi
          done
          [ -f build/.srcstamp ] || echo "no published core layer: a full (cold) build"

      - name: Dates from content
        env: { SRCSTAMP_NOW: "${{ steps.now.outputs.now }}" }
        run: python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - name: Exports + header case links
        run: |
          ph source export -a
          ph source mbg -a

      - name: The repositories' prepare recipes (recipes/prepare.sh)
        run: |
          for r in $(echo "$PHOREPOC_ADAPTATIONS" | tr : ' '); do
            [ -f "$r/recipes/prepare.sh" ] || continue
            echo "== $(basename "$r")"; (cd "$r" && bash recipes/prepare.sh)
          done

      - name: Resources (.rsc + the .rsg headers every component includes)
        run: |
          ph component resources -A > resources-1.log 2>&1 || true
          ph source casefix -a     # links the .rsg spellings just generated (Linux is case-sensitive)
          ph component resources -A 2>&1 | tee resources.log | tail -n 5
          echo "resources: $(grep -c ': FAILED' resources.log || true) component(s) failed"; grep ': FAILED' resources.log | sort -u | head -20 || true

      - name: Hand the tree on (run image)
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          printf 'FROM busybox:1.36\nCOPY build /build\n' > Dockerfile.layer; printf '*\n!build\n' > .dockerignore
          docker build -q -f Dockerfile.layer -t "$img" .
          docker push -q "$img"

  compile:
    needs: prepare
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # = SHARDS
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: The prepared tree
        run: |
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}
          touch build/.shard-start

      - name: Compile shard ${{ matrix.shard }}
        run: |
          ph component build -A -arch "$PHOREPOC_ARCH" -compile-only -shard ${{ matrix.shard }}/$SHARDS \
            2>&1 | tee compile.log | tail -n 20

      - name: The files this shard wrote
        run: |
          sudo find build -newer build/.shard-start \( -type f -o -type l \) -print0 \
            | sudo tar --null -T - --zstd -cf shard-${{ matrix.shard }}.tar.zst
          ls -l shard-${{ matrix.shard }}.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.tar.zst
          retention-days: 1
          compression-level: 0

  finish:
    needs: [prepare, compile]
    env: { SRCSTAMP_NOW: "${{ needs.prepare.outputs.now }}" }
    if: ${{ !cancelled() && needs.compile.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - id: setup
        uses: Phorepoc/pdk/.github/actions/board-setup@main
        with: { arch: "${{ inputs.arch }}" }

      - name: The prepared tree + every shard's objects
        run: |
          img="ghcr.io/$OWNER/$RUN_IMAGE"
          docker pull -q "$img"; id=$(docker create "$img" true); docker cp "$id:/build/." build/; docker rm "$id" >/dev/null
          docker rmi "$img" >/dev/null
          python3 pdk/tools/ci/srcstamp.py apply build ${{ steps.setup.outputs.list }}

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Unpack the shards (their objects are newer than every source, so the link pass does not recompile)
        run: for f in shards/*/*.tar.zst; do tar --zstd -xf "$f"; done; rm -rf shards

      - name: Link every component, providers first
        run: |
          ph component build -A -arch "$PHOREPOC_ARCH" 2>&1 | tee component-build.log | tail -n 20
          # a bulk build goes on past a component that fails (exit 1): the image steps are the verdict, so name them here
          failed=$(awk '/^=== /{c=$2} /FAIL/{print c}' component-build.log | tr -d : | sort -u)
          echo "components failed: $(echo "$failed" | grep -c . || true)"; echo $failed | fold -w 200

      - name: Relink what was linked before a provider of its existed (x32 import stubs; dependency cycles need passes)
        if: steps.setup.outputs.arch == 'x32'
        run: |
          for pass in 1 2 3 4; do
            keys=$(ph component stale | awk -F: '/: relink/ { print $1 }')
            [ -n "$keys" ] || break
            echo "pass $pass: relink $(echo $keys | wc -w): $(echo $keys | cut -c1-300)"
            ph component build -arch x32 $keys >> component-relink.log 2>&1 || true
          done
          ph component stale | tail -n 1

      - name: Own the build folder (the container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Record the source contents this build was made from
        run: python3 pdk/tools/ci/srcstamp.py save build ${{ steps.setup.outputs.list }}

      - name: Publish the core layer (core-<arch>:<core commit> + :main)
        if: inputs.publish_layer && inputs.arch != ''
        run: |
          img="ghcr.io/$OWNER/core-$PHOREPOC_ARCH"
          core="${{ steps.setup.outputs.core }}"
          printf 'FROM busybox:1.36\nCOPY build /build\n' > Dockerfile.layer; printf '*\n!build\n' > .dockerignore
          docker build -q -f Dockerfile.layer -t "$img:$core" -t "$img:main" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" .
          docker push -q "$img:$core"; docker push -q "$img:main"
          docker rmi "$img:$core" "$img:main" >/dev/null

      - name: The board's release files (board.conf RELEASE)
        if: inputs.images && inputs.arch == ''
        run: ph image release -b "${{ steps.setup.outputs.board }}" -o "$PWD/out"

      - name: Checksums + provenance
        if: inputs.images && inputs.arch == ''
        run: |
          mkdir -p out
          cp built-from.txt out/
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: inputs.images && inputs.arch == ''
        with:
          name: phorepoc-${{ steps.setup.outputs.board }}
          path: out/
          if-no-files-found: warn

      - name: Release
        if: inputs.images && inputs.release && inputs.arch == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$tag" -R "${{ github.repository }}" --title "$tag" --notes-file /dev/null --draft
          gh release upload "$tag" out/* -R "${{ github.repository }}" --clobber
