# release.yml -- automatic releases of the pdk. Every push to main is checked (Conventional Commit subjects); when the
# commits since the last release ask for one (tools/ci/next_version.sh: feat = minor, fix/perf = patch, breaking =
# major), this workflow tags it and publishes:
#   - phe and phonelab for Linux, Windows and macOS (amd64 + arm64), with SHA256SUMS
#   - the PhoneLab container image, ghcr.io/<owner>/phonelab:<version> and :latest (linux/amd64 + linux/arm64)
# Other repositories fetch a released phe with the setup action (.github/actions/setup-phe).
name: release

on:
  push:
    branches: [main]

# one release run at a time, in push order: each computes its version from the tags the previous one made
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commit subjects
        run: sh tools/ci/commit_lint.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: Next version
        id: v
        run: |
          v=$(sh tools/ci/next_version.sh)
          echo "next version: ${v:-none (nothing to release)}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The PhoneLab web page (embedded into phonelab)
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Cross-compile
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            for p in phe phonelab; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
                -o "stage/$p$ext" "./cmd/$p"
            done
            name="pdk-$VERSION-$os-$arch"
            if [ "$os" = windows ]; then
              (cd stage && zip -q "../dist/$name.zip" phe.exe phonelab.exe)
            else
              tar -czf "dist/$name.tar.gz" -C stage phe phonelab
            fi
            rm -rf stage
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The PhoneLab image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          img="ghcr.io/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/phonelab"
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$img:$VERSION" -t "$img:latest" --push .

  publish:
    needs: [version, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' ${last:+$last..}HEAD | grep -E '^- (feat|fix|perf|refactor)' || echo "- maintenance"
            echo
            echo "## Install"
            echo
            echo 'Download the archive for your system below, or run PhoneLab in Docker:'
            echo
            echo '```sh'
            echo "docker run -d -p 8737:8737 -v phonelab-data:/data ghcr.io/phorepoc/phonelab:$VERSION"
            echo '```'
          } > notes.md
          gh release create "$VERSION" dist/* --target "${{ github.sha }}" --title "pdk $VERSION" --notes-file notes.md
