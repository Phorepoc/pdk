# board-setup -- the steps every build job starts with: free disk, check out the repositories, build ph, fetch the
# pinned Symbian source, pull the toolchain image, set the PHOREPOC_* environment.
#
# Two kinds of build (docs/layering.md):
#   a board   the caller is a board repository: its board.conf names the repositories (REPOS) and the architecture,
#             its board.lock pins their commits
#   core      `arch` is given: pdk + core alone, for that architecture (core-layer.yml)
name: board-setup
description: Check out and prepare a Phorepoc build
inputs:
  arch:
    description: build core alone for this architecture (x32, arm); empty = the caller is a board repository
    required: false
    default: ""
outputs:
  list:
    description: the repositories checked out
    value: ${{ steps.repos.outputs.list }}
  core:
    description: the core commit checked out
    value: ${{ steps.pin.outputs.core }}
  board:
    description: the board's name (empty for a core build)
    value: ${{ steps.repos.outputs.board }}
  arch:
    description: the architecture built for
    value: ${{ steps.repos.outputs.arch }}
  release:
    description: the board's release recipe (board.conf RELEASE)
    value: ${{ steps.repos.outputs.release }}
runs:
  using: composite
  steps:
    - name: Make room (the source trees + a full build need ~25 GB)
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        docker image prune -af >/dev/null || true
        df -h /

    - name: Check out the caller (its board.conf + board.lock)
      uses: actions/checkout@v4
      with:
        path: caller

    - name: The repositories
      id: repos
      shell: bash
      run: |
        if [ -n "${{ inputs.arch }}" ]; then
          echo "list=pdk core" >> "$GITHUB_OUTPUT"; echo "arch=${{ inputs.arch }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        [ -f caller/board.conf ] || { echo "no board.conf in ${{ github.repository }} (and no arch given)"; exit 1; }
        NAME= ARCH= REPOS= RELEASE=; . caller/board.conf
        [ -n "$NAME" ] && [ -n "$ARCH" ] || { echo "board.conf: NAME and ARCH are required"; exit 1; }
        { echo "list=pdk core $REPOS"; echo "board=$NAME"; echo "arch=$ARCH"; echo "release=$RELEASE"; } >> "$GITHUB_OUTPUT"

    - name: Check out the repositories at the pinned commits
      id: pin
      shell: bash
      run: |
        lock=caller/board.lock
        : > built-from.txt
        for r in ${{ steps.repos.outputs.list }}; do
          ref=main
          [ -f "$lock" ] && ref=$(awk -v r="$r" '$1 == r { print $2 }' "$lock") && [ -n "$ref" ] || ref=main
          # the caller's own repository builds at the commit that triggered the run
          [ "${{ github.repository }}" = "${{ github.repository_owner }}/$r" ] && ref="${{ github.sha }}"
          echo "$r @ $ref"
          git init -q "$r"
          git -C "$r" fetch -q --depth 1 "https://github.com/${{ github.repository_owner }}/$r.git" "$ref"
          git -C "$r" checkout -q FETCH_HEAD
          echo "$r $(git -C "$r" rev-parse HEAD)" >> built-from.txt
        done
        cat built-from.txt
        echo "core=$(awk '$1 == "core" { print $2 }' built-from.txt)" >> "$GITHUB_OUTPUT"
        rm -rf caller   # (a second board.conf next to core would be a second board for ph)

    - uses: actions/setup-go@v5
      with:
        go-version-file: pdk/go.mod
        cache-dependency-path: pdk/go.sum

    - name: Build ph
      shell: bash
      run: |
        (cd pdk && go build -o ../bin/ph ./cmd/ph)
        echo "$PWD/bin" >> "$GITHUB_PATH"

    - name: Fetch the Symbian source (pinned in core's sources.lock)
      shell: bash
      run: PHOREPOC_SYMBIAN="$PWD/core/symbian" sh core/fetch.sh > fetch.log && tail -n 3 fetch.log

    - name: Pull the toolchain image + log in to ghcr
      shell: bash
      run: |
        docker pull -q "$PHOREPOC_IMAGE"
        echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Environment
      shell: bash
      run: |
        {
          echo "PHOREPOC_PDK=$PWD/pdk"
          echo "PHOREPOC_CORE=$PWD/core"
          echo "PHOREPOC_SYMBIAN=$PWD/core/symbian"
          echo "PHOREPOC_BUILD=$PWD/build"
          echo "PHOREPOC_ARCH=${{ steps.repos.outputs.arch }}"
          echo "PHOREPOC_ADAPTATIONS=$(for r in ${{ steps.repos.outputs.list }}; do case $r in pdk|core) ;; *) printf '%s:' "$PWD/$r" ;; esac; done | sed 's/:$//')"
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)"
        } >> "$GITHUB_ENV"
        mkdir -p build
