# Linux: docker compose -f docker/compose.yaml up -d      (runs the released image, ghcr.io/phorepoc/phonelab; no clone needed:
#        save this file and run the same command; PHONELAB_VERSION=v0.9.0 pins a release, default latest)
# From source: docker compose -f docker/compose.yaml -f docker/compose.build.yaml up -d --build   (from the repository root)
# The phone re-enumerates on every reboot, so instead of passing one /dev/ttyACMn (which goes stale) the
# container gets the whole USB-serial major (166 = ttyACM) through a cgroup rule plus a live /dev bind:
# the service then finds the phone by VID/PID each time it comes back. Install 99-phonelab.rules on the host
# for a stable /dev/phorepoc-phlink name too. A Nokia Symbian phone (driver "nokia") rides the same rule: its
# ACM ports are ttyACM* as well (major 166), named /dev/nokia-acm-<ifnum> by 99-phonelab.rules (docs/nokia.md).
services:
  phonelab:
    image: ghcr.io/phorepoc/phonelab:${PHONELAB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8737:8737"
    volumes:
      - phonelab-data:/data
      - /dev:/dev
      - /run/udev:/run/udev:ro      # lets the VID/PID enumerator read device properties
    device_cgroup_rules:
      - "c 166:* rmw"               # ttyACM*
volumes:
  phonelab-data:
